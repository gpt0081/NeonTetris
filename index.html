<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080b12" />
  <title>NEON TETRIS</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="app" aria-label="테트리스 게임">
    <header class="titlebar">
      <div>
        <p class="eyebrow">ARCADE // 01</p>
        <h1>NEON TETRIS</h1>
      </div>
      <div class="top-actions"><button id="soundBtn" class="icon-btn" type="button" aria-label="사운드 켜기">🔇</button><button id="pauseBtn" class="icon-btn" type="button" aria-label="일시정지">Ⅱ</button></div>
    </header>

    <section class="game-shell">
      <aside class="panel left-panel" aria-label="게임 정보">
        <div class="stat">
          <span>SCORE</span>
          <strong id="score">0</strong>
        </div>
        <div class="stat">
          <span>BEST</span>
          <strong id="best">0</strong>
        </div>
        <div class="stat two-col">
          <div><span>LINES</span><strong id="lines">0</strong></div>
          <div><span>LEVEL</span><strong id="level">1</strong></div>
        </div>
        <div class="mini">
          <span>HOLD</span>
          <canvas id="holdCanvas" width="120" height="120" aria-label="보관 블록"></canvas>
        </div>
      </aside>

      <div class="board-wrap">
        <canvas id="gameCanvas" width="300" height="600" aria-label="테트리스 게임판"></canvas>
        <div id="fxBanner" class="fx-banner" aria-hidden="true"></div>
        <div id="overlay" class="overlay hidden" role="status" aria-live="polite">
          <div class="overlay-card">
            <p id="overlayKicker">PAUSED</p>
            <h2 id="overlayTitle">게임 일시정지</h2>
            <button id="overlayBtn" type="button">계속하기</button>
          </div>
        </div>
      </div>

      <aside class="panel right-panel" aria-label="다음 블록 및 조작법">
        <div class="mini">
          <span>NEXT</span>
          <canvas id="nextCanvas" width="120" height="120" aria-label="다음 블록"></canvas>
        </div>
        <div class="keys">
          <span>KEYS</span>
          <p>← → 이동</p>
          <p>↓ 소프트 드롭</p>
          <p>↑ / X 회전</p>
          <p>Space 하드 드롭</p>
          <p>C 홀드 · P 일시정지</p>
        </div>
        <button id="restartBtn" class="restart" type="button">RESTART</button>
      </aside>
    </section>

    <section class="mobile-controls" aria-label="모바일 조작">
      <div class="dpad" aria-label="방향 조작">
        <button class="left-key" data-action="left" aria-label="왼쪽">←</button>
        <button class="down-key" data-action="down" aria-label="아래">↓</button>
        <button class="right-key" data-action="right" aria-label="오른쪽">→</button>
      </div>
      <div class="action-pad" aria-label="게임 동작">
        <button class="rotate-key" data-action="rotate" aria-label="회전">↻<small>ROTATE</small></button>
        <button class="hold-key" data-action="hold" aria-label="블록 보관">H<small>HOLD</small></button>
        <button class="drop-key" data-action="drop" aria-label="하드 드롭">▼<small>DROP</small></button>
      </div>
    </section>

    <footer>
      <span>7-BAG RANDOMIZER</span>
      <span>GHOST PIECE ENABLED</span>
      <span>LOCAL BEST SCORE</span>
    </footer>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
